version: 2
builds:
  -
    main: .
    ldflags:
      - >-
        -s -w
        -X main.version={{.Version}}
        -X main.commit={{.FullCommit}}
        -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "7"

checksum:
    name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
